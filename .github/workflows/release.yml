# Build office-plugin installers and publish a GitHub Release.
# Trigger: push a tag like plugins-v0.0.2 (or Run workflow and type that tag).
#
# Needs macOS so Mac .dmg / .app installers can be built (hdiutil, osacompile).
name: Release plugins

on:
  push:
    tags:
      - "plugins-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. plugins-v0.0.2)"
        required: true
        type: string

concurrency:
  group: release-plugins-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    env:
      MARINAMOJI_PLUGIN_BASE: https://marinamoji.github.io/plugin/word
      MARINAMOJI_INCLUDE_WORD: "1"
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "${TAG}" in
            plugins-v*) VERSION="${TAG#plugins-v}" ;;
            *)
              echo "Tag must look like plugins-v0.0.2 (got: ${TAG})"
              exit 1
              ;;
          esac
          if [[ -z "${VERSION}" ]]; then
            echo "Empty version after plugins-v prefix"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${TAG} (version ${VERSION})"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # Tag push checks out that tag. Manual "Run workflow" checks out the selected branch.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: word/package-lock.json

      - name: Install librsvg
        run: brew install librsvg

      - name: Install Word npm dependencies
        working-directory: word
        run: npm ci

      - name: Set up signing keychain
        # Skipped (installers stay ad-hoc signed) until the secrets exist.
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${P12_BASE64}" ]]; then
            echo "No Developer ID secrets; skipping signing."
            exit 0
          fi
          KEYCHAIN_NAME="marinamoji-plugins.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" login.keychain
          echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN_NAME" \
            -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/app.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME" > /dev/null
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_NAME" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"')"
          if [[ -z "$IDENTITY" || "$IDENTITY" != *"($APPLE_TEAM_ID)"* ]]; then
            echo "::error::Developer ID Application identity missing or not in team $APPLE_TEAM_ID."
            exit 1
          fi
          echo "APP_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build release artifacts
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_NOTARY_API_PRIVATE_KEY_P8: ${{ secrets.APPLE_NOTARY_API_PRIVATE_KEY_P8 }}
          MARINAMOJI_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          MARINAMOJI_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          MARINAMOJI_GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x packaging/*.sh packaging/mac/*.sh libreoffice/*.sh onlyoffice/*.sh word/*.sh 2>/dev/null || true
          ./packaging/build-release.sh
          ./libreoffice/validate-extension.sh packaging/release/MarinaMojiKaeriten.oxt

      - name: Publish GitHub Release
        # Publish assets before updating the LO feed so versioned download URLs resolve.
        env:
          GH_TOKEN: ${{ github.token }}
          MARINAMOJI_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          MARINAMOJI_GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x packaging/publish-github-release.sh
          ./packaging/publish-github-release.sh

      - name: Push synced version channel to main
        # build-release.sh rewrites pages/; Pages hosts from main, so commit the sync there.
        # Runs after the Release so MarinaMojiKaeriten.update.xml versioned URLs work.
        run: |
          set -euo pipefail
          WT="${RUNNER_TEMP}/mm-main"
          rm -rf "${WT}"
          git fetch origin main
          git worktree add "${WT}" origin/main
          cp pages/version.json "${WT}/pages/version.json"
          cp pages/MarinaMojiKaeriten.update.xml "${WT}/pages/MarinaMojiKaeriten.update.xml"
          git -C "${WT}" config user.name "github-actions[bot]"
          git -C "${WT}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${WT}" add pages/version.json pages/MarinaMojiKaeriten.update.xml
          if git -C "${WT}" diff --cached --quiet; then
            echo "Version channel already in sync on main"
          else
            git -C "${WT}" commit -m "Sync version channel for ${{ steps.meta.outputs.tag }}"
            git -C "${WT}" push origin HEAD:main
          fi
          git worktree remove "${WT}" --force

  windows-installer:
    # Per-user Word add-in installer (Inno Setup). Attached to the Release made above.
    needs: release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installer
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${{ needs.release.outputs.version }}"
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" \
            -p marinamoji-kaeriten-word.xml -D "${RUNNER_TEMP}"
          choco install innosetup --no-progress -y
          mkdir -p out
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=${VERSION}" \
            "/DManifestFile=$(cygpath -w "${RUNNER_TEMP}/marinamoji-kaeriten-word.xml")" \
            "/DOutDir=$(cygpath -w "$PWD/out")" \
            packaging/windows/marinamoji-kaeriten-word.iss

      - name: Attach to Release and refresh checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.tag }}"
          gh release upload "${TAG}" out/marinamoji-kaeriten-word-setup.exe \
            -R "${GITHUB_REPOSITORY}" --clobber
          gh release download "${TAG}" -R "${GITHUB_REPOSITORY}" -p SHA256SUMS.txt -D out --clobber
          (cd out && sha256sum marinamoji-kaeriten-word-setup.exe >> SHA256SUMS.txt)
          gh release upload "${TAG}" out/SHA256SUMS.txt -R "${GITHUB_REPOSITORY}" --clobber
