# Build office-plugin installers and publish a GitHub Release.
# Trigger: push a tag like plugins-v0.0.2 (or Run workflow and type that tag).
#
# Needs macOS so Mac .dmg / .app installers can be built (hdiutil, osacompile).
name: Release plugins

on:
  push:
    tags:
      - "plugins-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. plugins-v0.0.2)"
        required: true
        type: string

concurrency:
  group: release-plugins-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      MARINAMOJI_PLUGIN_BASE: https://marinamoji.github.io/plugin/word
      MARINAMOJI_INCLUDE_WORD: "1"
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "${TAG}" in
            plugins-v*) VERSION="${TAG#plugins-v}" ;;
            *)
              echo "Tag must look like plugins-v0.0.2 (got: ${TAG})"
              exit 1
              ;;
          esac
          if [[ -z "${VERSION}" ]]; then
            echo "Empty version after plugins-v prefix"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Publishing ${TAG} (version ${VERSION})"

      - name: Checkout
        uses: actions/checkout@v4
        # Tag push checks out that tag. Manual "Run workflow" checks out the selected branch.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: word/package-lock.json

      - name: Install librsvg
        run: brew install librsvg

      - name: Install Word npm dependencies
        working-directory: word
        run: npm ci

      - name: Build release artifacts
        env:
          MARINAMOJI_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x packaging/*.sh packaging/mac/*.sh libreoffice/*.sh onlyoffice/*.sh word/*.sh 2>/dev/null || true
          ./packaging/build-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MARINAMOJI_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          MARINAMOJI_GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x packaging/publish-github-release.sh
          ./packaging/publish-github-release.sh
